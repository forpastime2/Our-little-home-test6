<style>

tion:column}.room:before{content:"✦　 ·　 ✧　 ·　 ✦";position:absolute;right:16px;top:12px;color:#ffe5a488;letter-spacing:.4em;font-size:13px;pointer-events:none}

.roomhead{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:12px}.roomhead h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(21px,4vw,30px);margin:0 0 4px;color:#ffe7b4}.roomhead p{margin:0;font-size:11px;color:#e3d1c1}.pill{border:1px solid #f3d49b88;background:#f3d49b12;border-radius:99px;padding:6px 10px;font-size:11px;white-space:nowrap}.content{min-height:0;flex:1;display:flex;flex-direction:column;gap:10px}.panel{background:var(--panel);border:1px solid #f5d99a33;border-radius:17px;padding:12px;min-height:0}.panel h3{font-size:12px;font-weight:600;letter-spacing:.06em;color:#f4d59c;margin:0 0 8px}.muted{font-size:11px;color:#d5c4b5}.btn{border:1px solid #f2d49a88;background:linear-gradient(135deg,#a77b4d,#74523d);border-radius:12px;padding:9px 12px;font-size:12px;color:#fff8e9}.btn.ghost{background:#fff1dc0a;border-color:#f2d49a55}.btn:active{transform:scale(.98)}input,textarea,select{width:100%;background:#120f1dbb;color:#fff5e6;border:1px solid #f5d99a44;border-radius:10px;padding:9px;font-size:12px;outline:none}input::placeholder,textarea::placeholder{color:#bcaeaa}textarea{resize:none;min-height:58px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row input{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;min-height:0;flex:1}.scrollinner{overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#92785b transparent}.nav{height:53px;display:flex;justify-content:space-around;align-items:center;padding:0 5px calc(env(safe-area-inset-bottom,0px));gap:3px}.nav button{border:0;background:transparent;color:#d7c4b4;font-size:10px;display:flex;flex-direction:column;gap:3px;align-items:center;min-width:0;flex:1;padding:5px 1px}.nav button span{font-size:19px;line-height:20px}.nav button.active{color:#ffe1a2}.nav button.active span{filter:drop-shadow(0 0 7px #f4c76e)}.entry{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at center,#51405d,#171522 70%)}.door{width:min(340px,90vw);text-align:center}.door-art{height:min(48dvh,380px);max-height:380px;min-height:230px;width:75%;margin:0 auto 18px;border:8px solid #67452e;border-radius:120px 120px 12px 12px;background:repeating-linear-gradient(90deg,#503322 0 12px,#69472f 13px 24px,#3d291f 25px 28px);box-shadow:inset 0 0 0 4px #b48a55,inset 0 0 30px #120c0a,0 0 50px #f7d28b33;position:relative;display:flex;align-items:center;justify-content:center;transition:transform 1s,opacity 1s;transform-origin:left center}.door-art:before{content:"OUR LITTLE HOME";font-family:Georgia,serif;letter-spacing:.13em;color:#f6dba0;border:1px solid #d6b276;padding:18px 9px;border-radius:50%;font-size:12px}.door-art:after{content:"•";position:absolute;right:17%;top:54%;font-size:28px;color:#e6bd6c;text-shadow:0 0 10px #ffdd82}.door.open{transform:perspective(600px) rotateY(-68deg);opacity:.2}.door h1{font-family:Georgia,serif;color:#ffe4ad;font-weight:400;font-size:30px;margin:0 0 6px}.door p{font-size:12px;color:#dfcdbd;margin:0 0 18px}.door input{text-align:center;margin-bottom:9px}.notice{font-size:10px;color:#d2bdac;margin-top:10px;line-height:1.6}.hide{display:none!important}.photo-frame{border:3px solid #d4ae66;border-radius:48% / 18%;padding:4px;background:#3d2b30;box-shadow:0 0 14px #edce8555;overflow:hidden;min-height:70px;display:flex;align-items:center;justify-content:center}.photo-frame img{width:100%;height:100%;max-height:125px;object-fit:cover;border-radius:40% / 15%}.photo-placeholder{font-size:11px;text-align:center;color:#e6cda2;padding:10px}.stat{font-family:Georgia,serif;font-size:clamp(24px,5vw,38px);color:#ffe4a6}.statlabel{font-size:10px;color:#d7c3b0}.hallgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:10px;flex:1;min-height:0}.hallleft,.hallright{display:flex;flex-direction:column;gap:10px;min-height:0}.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.day{border:1px solid #f5d99a22;background:#fff1dc08;border-radius:7px;padding:5px 0;font-size:10px;text-align:center;min-height:25px}.day.selected{background:#a77b4d;border-color:#ffe4a6}.day.marked:after{content:" ·";color:#ffe4a6}.message-list{display:flex;flex-direction:column;gap:7px}.message{background:#fff1dc0c;border:1px solid #f5d99a22;border-radius:12px;padding:9px;font-size:12px}.message .meta{font-size:10px;color:#d6bd9a;margin-bottom:4px}.taglist{display:flex;flex-wrap:wrap;gap:6px}.tag{border:1px solid #f5d99a44;border-radius:99px;padding:6px 9px;background:#fff1dc09;font-size:11px}.tag.selected{background:#987047;border-color:#ffe0a1}.chatlog{display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0;flex:1;padding:2px}.bubble{max-width:86%;border:1px solid #f5d99a33;background:#342638;border-radius:14px 14px 14px 4px;padding:8px 10px;font-size:12px;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#79583f;border-radius:14px 14px 4px 14px}.bubble small{display:block;color:#ddc8ac;font-size:9px;margin-top:4px}.full{width:100%}.room-art{position:absolute;bottom:10px;right:14px;opacity:.16;font-size:60px;pointer-events:none}.season{display:flex;gap:6px;flex-wrap:wrap}.season button{font-size:10px;padding:6px 8px}.tiny{font-size:10px}.toast{position:absolute;z-index:20;left:50%;bottom:72px;transform:translateX(-50%);background:#fff1dff2;color:#342335;border-radius:14px;padding:10px 14px;font-size:12px;box-shadow:0 5px 20px #0005;max-width:90%;text-align:center}.creature{position:absolute;z-index:5;right:20px;top:65px;border:1px solid #f4d28a;background:#392b43f5;border-radius:20px;padding:9px 12px;box-shadow:0 0 22px #e6bf7455;font-size:12px;animation:float 2s ease-in-out infinite}.creature b{font-size:26px;display:block;text-align:center}@keyframes float{50%{transform:translateY(-5px)}}.season-snow:after{content:"❄  ·  ❄　·　❄　·　❄";position:absolute;top:60px;left:10%;color:#fff9d5aa;letter-spacing:1.2em;pointer-events:none;animation:drift 12s linear infinite;z-index:2}.season-sakura:after{content:"🌸　·　🌸　·　🌸";position:absolute;top:70px;left:8%;opacity:.55;animation:drift 15s linear infinite;z-index:2;pointer-events:none}.season-halloween:after{content:"✦　🕯　✦　🦇";position:absolute;top:65px;right:12%;opacity:.6;z-index:2;pointer-events:none}@keyframes drift{0%{transform:translateY(-10px)}100%{transform:translateY(70vh)}}.season-xmas{background:linear-gradient(140deg,#17352dcc,#382239dd)}.season-summer{background:linear-gradient(140deg,#214352dd,#473550dd)}.season-sakura{background:linear-gradient(140deg,#533347dd,#352744dd)}.season-halloween{background:linear-gradient(140deg,#422343ee,#4a2b25dd)}.season-snow{background:linear-gradient(140deg,#2b3b56dd,#342944dd)}.season-spring{background:linear-gradient(140deg,#314c43dd,#3b3048dd)}.night .app{} .morning .app:before{filter:sepia(.3) brightness(1.45)}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;padding:8px 0;border-bottom:1px solid #f5d99a22}.smalllabel{font-size:10px;color:#e3cda9;display:block;margin-bottom:5px}
@media(min-width:760px){.room{max-width:1000px;margin:0 auto 8px;height:calc(100dvh - 119px);padding:24px 30px}.top{max-width:1000px;margin:auto}.nav{max-width:800px;margin:auto}.content{gap:12px}.panel{padding:15px}.roomhead{margin-bottom:16px}}
@media(max-width:390px){.top{height:50px}.room{height:calc(100dvh - 108px);margin:0 7px 5px;padding:11px;border-radius:18px}.nav{height:53px}.roomhead{margin-bottom:8px}.panel{padding:9px}.hallgrid{gap:7px}.stat{font-size:25px}.nav button{font-size:9px}.nav button span{font-size:17px}.btn{padding:8px 9px}}
</style></head><body>
<div class="app" id="app">
<header class="top"><div><div class="brand">✧ Our Little Home</div><small id="topSub">A little world for two</small></div><div class="row"><button class="iconbtn" id="seasonQuick" title="季節">🍂</button><button class="iconbtn" id="settingsOpen" title="設定">⚙</button></div></header>
<main id="room" class="room"></main><nav class="nav" id="nav"><button data-room="hall" class="active"><span>🏡</span>玄関</button><button data-room="library"><span>🌟</span>図書館</button><button data-room="living"><span>🕯️</span>リビング</button><button data-room="kitchen"><span>🍲</span>食卓</button><button data-room="bedroom"><span>🌙</span>寝室</button><button data-room="annex"><span>🗝️</span>別館</button></nav>
<div id="toast" class="toast hide"></div><div id="creature" class="creature hide"><b>🦊✨</b>あなたにお手紙が届いたよ！<br><button class="btn" id="openLetter">受け取る</button></div>
<div id="entry" class="entry"><div class="door"><div class="door-art" id="doorArt"></div><h1>Our Little Home</h1><p>ふたりだけの、小さな魔法の家</p><input id="doorPassword" type="password" placeholder="合言葉を入力（初期設定は 1234）" autocomplete="current-password"><button class="btn full" id="openDoor">扉を開く ✨</button><div class="notice">この試作品は端末内にデータを保存します。<br>ふたりの端末間で共有するには、あとで無料の共有データベース設定が必要です。</div></div></div>
</div>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const defaults={password:'1234',started:'2026-04-13',anniversary:'2026-11-13',name1:'わたし',name2:'あなた',role:'male',season:'auto',timeMode:'auto',memories:[],letters:[],chat:[],plans:[],food1:[],food2:[],mood1:'ぎゅっとしてほしい',mood2:'',requests:'',annex:[],unlocked:false};
let data;try{data={...defaults,...JSON.parse(localStorage.getItem('olh-data')||'{}')}}catch{data={...defaults}}let current='hall',selectedDate=today(),chosenFood=[],chosenMood='',toastTimer,letterPending=false;
function save(){localStorage.setItem('olh-data',JSON.stringify(data))}function today(){return new Date().toISOString().slice(0,10)}function dateLabel(d){return new Date(d+'T12:00:00').toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'})}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),2600)}function daysBetween(a,b){return Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}function dateSeason(){let m=new Date().getMonth()+1;if(m===12||m===1)return'snow';if(m>=2&&m<=4)return'sakura';if(m>=5&&m<=6)return'spring';if(m>=7&&m<=8)return'summer';if(m>=9&&m<=10)return'halloween';return'xmas'}function getSeason(){return data.season==='auto'?dateSeason():data.season}function setTheme(){let s=getSeason();$('#room').className='room season-'+s;let h=new Date().getHours();let isMorning=data.timeMode==='morning'||(data.timeMode==='auto'&&h>=5&&h<17);$('#app').classList.toggle('morning',isMorning);$('#app').classList.toggle('night',!isMorning);$('#topSub').textContent=(isMorning?'☀ 朝の光':'☾ 夜の灯り')+' · '+({snow:'雪の季節',sakura:'桜の季節',spring:'新緑の季節',summer:'夏の海',halloween:'ハロウィン',xmas:'クリスマス'}[s]||'ふたりの季節')}
function switchRoom(r){current=r;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.room===r));render()}function header(title,desc,tag='✦ ふたりの空間'){return `<div class="roomhead"><div><h1>${title}</h1><p>${desc}</p></div><span class="pill">${tag}</span></div>`}function panel(title,body,extra=''){return `<section class="panel ${extra}"><h3>${title}</h3>${body}</section>`}function render(){setTheme();let html='';if(current==='hall')html=renderHall();if(current==='library')html=renderLibrary();if(current==='living')html=renderLiving();if(current==='kitchen')html=renderKitchen();if(current==='bedroom')html=renderBedroom();if(current==='annex')html=renderAnnex();if(current==='settings')html=renderSettings();$('#room').innerHTML=html;const roomBg={hall:'hall',library:'library',living:'living',kitchen:'kitchen',bedroom:'bedroom',annex:'annex',settings:'hall'}[current]||'hall';$('#room').style.setProperty('--room-bg',`url('assets/rooms/${roomBg}.jpg')`);wireRoom()}
function renderHall(){let days=Math.max(0,daysBetween(data.started,today()));let left=Math.max(0,daysBetween(today(),data.anniversary));let photos=data.memories.filter(m=>m.photo).slice().sort(()=>Math.random()-.5).slice(0,4);let frames=Array.from({length:4},(_,i)=>{let m=photos[i];return `<div class="photo-frame">${m?`<img src="${m.photo}" alt="思い出の写真"><span class="hide">${esc(m.title)}</span>`:`<div class="photo-placeholder">✧<br>ふたりの思い出を<br>額縁に飾ろう</div>`}</div>`}).join('');let plans=data.plans.filter(p=>p.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2);return `${header('玄関ホール','扉の向こうは、ふたりだけの世界','🏡 Welcome home')}<div class="content"><div class="hallgrid"><div class="hallleft">${panel('✧ OUR MEMORIES',`<div class="frames">${frames}</div><div class="muted" style="margin-top:7px">星の図書館に写真を飾ると、ここに現れるよ。</div>`,'')}<div class="grid2" style="flex:0 0 auto">${panel('♡ ふたりの日々',`<div class="stat">${days}<span style="font-size:13px"> 日</span></div><div class="statlabel">一緒に歩んできた日々</div>`)}${panel('✧ 次の記念日',`<div class="stat">${left}<span style="font-size:13px"> 日</span></div><div class="statlabel">${esc(dateLabel(data.anniversary))} まで</div>`)}</div></div><div class="hallright">${panel('📅 これからの約束',`${plans.length?plans.map(p=>`<div class="message"><div class="meta">${esc(dateLabel(p.date))}</div>${esc(p.title)}</div>`).join(''):'<div class="muted">まだ予定はないみたい。<br>新しい約束をつくろう。</div>'}<button class="btn ghost" data-action="goto-calendar" style="margin-top:8px">カレンダーを開く →</button>`,'')} ${panel('💌 小さなお知らせ',`<div class="muted">${data.letters.filter(l=>l.to==='both'&&!l.read).length?'届いた手紙が待っているよ。':'今日も、ふたりの家へおかえり。'}</div><button class="btn" data-action="check-letter" style="margin-top:8px">手紙をたしかめる ✨</button>`,'')}</div></div></div><div class="room-art">⌂</div>`}
function renderCalendar(){let d=new Date(selectedDate+'T12:00:00'),year=d.getFullYear(),month=d.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();let marked=new Set([...data.memories.map(m=>m.date),...data.plans.map(p=>p.date)]);return `<div class="row" style="justify-content:space-between;margin-bottom:7px"><button class="btn ghost" data-action="month-prev">‹</button><b style="font-size:12px">${year}年 ${month+1}月</b><button class="btn ghost" data-action="month-next">›</button></div><div class="calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="muted" style="text-align:center;font-size:10px">${x}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{let n=i+1,key=`${year}-${String(month+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;return `<button class="day ${selectedDate===key?'selected':''} ${marked.has(key)?'marked':''}" data-date="${key}">${n}</button>`}).join('')}</div>`}
function renderLibrary(){let mem=data.memories.filter(m=>m.date===selectedDate);let letters=data.letters.filter(l=>l.date===selectedDate||l.futureDate===selectedDate);return `${header('星の図書館','日付を選んで、思い出を本棚にしまおう','🌟 Memory Library')}<div class="content"><div class="grid2"><div class="panel">${renderCalendar()}<div class="muted" style="margin-top:8px">● 印は思い出や予定がある日</div></div><div class="panel" style="display:flex;flex-direction:column;gap:8px;overflow:hidden"><h3>✧ ${dateLabel(selectedDate)}</h3><input id="memoryTitle" placeholder="思い出のタイトル（例：初めての旅行）"><textarea id="memoryText" placeholder="その日のこと、忘れたくない気持ち…" rows="2"></textarea><label class="btn ghost" style="text-align:center">📷 写真を選ぶ<input id="memoryPhoto" type="file" accept="image/*" multiple style="display:none"></label><div class="muted" id="photoCount">写真はこの端末内に保存されます</div><button class="btn" data-action="save-memory">思い出を本棚にしまう ✧</button><div class="scrollinner" style="flex:1">${mem.length?mem.map(m=>`<div class="message">${m.photo?`<img src="${m.photo}" style="width:100%;max-height:100px;object-fit:cover;border-radius:8px;margin-bottom:5px">`:''}<b>${esc(m.title||'名前のない思い出')}</b><div class="muted" style="margin-top:4px">${esc(m.text)}</div><button class="btn ghost" data-action="delete-memory" data-id="${m.id}" style="margin-top:6px">削除</button></div>`).join(''):'<div class="muted">この日のページはまだ真っ白。<br>思い出をひとつ残してみよう。</div>'}</div></div></div><div class="grid2" style="flex:0 0 30%"><div class="panel" style="overflow:hidden;display:flex;flex-direction:column;gap:7px"><h3>💌 手紙を書く</h3><input id="letterTitle" placeholder="手紙のタイトル"><textarea id="letterBody" placeholder="今の気持ち、未来のふたりへ…"></textarea><div class="row"><select id="letterTo"><option value="both">恋人へ</option><option value="future">未来のふたりへ</option></select><input id="letterDate" type="date" value="${selectedDate}" aria-label="手紙の日付"></div><button class="btn" data-action="save-letter">封をして届ける 💌</button></div><div class="panel scrollinner"><h3>📚 この日の記録</h3>${letters.length?letters.map(l=>`<div class="message"><div class="meta">${esc(l.title)} · ${l.to==='future'?'未来への手紙':'手紙'}</div>${esc(l.body)}<div class="muted" style="margin-top:5px">${esc(l.date)}</div></div>`).join(''):'<div class="muted">この日の手紙はまだないよ。</div>'}</div></div></div>`}
function renderLiving(){return `${header('リビング','なんでもない話も、ここでふたりの思い出に','🕯 Our Living Room')}<div class="content"><div class="panel" style="display:flex;flex-direction:column;flex:1;min-height:0"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">♡ ふたりの会話</h3><span class="pill" id="typingStatus">オンライン風プレビュー</span></div><div class="chatlog" id="chatlog">${data.chat.map(c=>`<div class="bubble ${c.who==='me'?'mine':''}">${esc(c.text)}<small>${esc(c.who==='me'?data.name1:data.name2)} · ${esc(c.time)} ${c.who==='me'?'✓✓':''}</small></div>`).join('')||'<div class="muted" style="text-align:center;margin:auto">最初のひとことを送ってみよう ✨</div>'}</div><div class="muted" style="margin:6px 0" id="typingHint">ふたりの会話がここに増えていくよ。</div><div class="row"><input id="chatInput" placeholder="メッセージを書く…"><button class="btn" data-action="send-chat">送信 ↗</button></div><div class="muted" style="margin-top:6px">試作品：この端末内のデモチャットです。別端末とのリアルタイム同期は未接続。</div></div></div>`}
const foods=['和食','洋食','中華','フレンチ','イタリアン','タイ料理','ベトナム料理','インド料理','メキシカン','トルコ料理','韓国料理','スペイン料理','お寿司','焼肉','ラーメン','カフェごはん','甘いもの','おうちごはん','軽めがいい','なんでもOK'];function renderKitchen(){return `${header('食卓兼キッチン','今夜はどんな味の気分？ふたりの「食べたい」を合わせよう','🍲 Our Table')}<div class="content"><div class="grid2"><div class="panel"><h3>♡ ${esc(data.name1)}の気分</h3><div class="taglist">${foods.map(f=>`<button class="tag ${data.food1.includes(f)?'selected':''}" data-food="1" data-value="${f}">${f}</button>`).join('')}</div><button class="btn" data-action="save-food1" style="margin-top:10px">この気分を保存</button></div><div class="panel"><h3>♡ ${esc(data.name2)}の気分</h3><div class="taglist">${foods.map(f=>`<button class="tag ${data.food2.includes(f)?'selected':''}" data-food="2" data-value="${f}">${f}</button>`).join('')}</div><button class="btn" data-action="save-food2" style="margin-top:10px">この気分を保存</button></div></div><div class="panel"><h3>✧ ふたりの食卓メモ</h3><div class="row" style="flex-wrap:wrap"><div style="flex:1;min-width:120px"><div class="muted">${esc(data.name1)}</div><b>${data.food1.join(' · ')||'まだ選んでいないよ'}</b></div><div style="color:#e8c67f;font-size:22px">♡</div><div style="flex:1;min-width:120px"><div class="muted">${esc(data.name2)}</div><b>${data.food2.join(' · ')||'まだ選んでいないよ'}</b></div></div><div class="muted" style="margin-top:8px">同じ料理があれば、ふたりの今夜の正解かも。</div></div></div>`}
const moods=['ぎゅっとしてほしい','話を聞いてほしい','褒めてほしい','甘えたい','甘えられたい','一人の時間がほしい','一緒にのんびりしたい','外に出かけたい','おいしいものが食べたい','笑いたい','少し疲れている','不安な気持ち','感謝を伝えたい','手をつなぎたい','ハグしたい','キスしたい','映画を観たい','散歩したい','相談したい','そっと見守ってほしい','励ましてほしい','そばにいてほしい','サプライズがほしい','一緒に家事したい','ゲームしたい','早く寝たい','話し合いたい','仲直りしたい','何か新しいことしたい','特にいつも通り'];function renderBedroom(){return `${header('寝室','言葉にするのが難しい気持ちも、そっと共有','🌙 Our Bedroom')}<div class="content"><div class="grid2"><div class="panel"><h3>♡ ${esc(data.name1)}の今の気分</h3><div class="taglist">${moods.map(m=>`<button class="tag ${data.mood1===m?'selected':''}" data-mood="1" data-value="${m}">${m}</button>`).join('')}</div><div class="muted" style="margin-top:9px">今の気持ちをひとつ選んでね。</div></div><div class="panel"><h3>♡ ${esc(data.name2)}の今の気分</h3><div class="taglist">${moods.map(m=>`<button class="tag ${data.mood2===m?'selected':''}" data-mood="2" data-value="${m}">${m}</button>`).join('')}</div><div class="muted" style="margin-top:9px">選んだ気分はこの端末に保存されるよ。</div></div></div><div class="panel" style="display:flex;flex-direction:column;gap:8px;flex:0 0 31%"><h3>♡ ふたりへのお願い・ありがとう</h3><textarea id="requests" placeholder="してほしいこと、少し直してほしいこと、ありがとう…">${esc(data.requests)}</textarea><div class="row" style="justify-content:space-between"><span class="muted">責めるより、気持ちを伝えるための場所。</span><button class="btn" data-action="save-requests">保存する</button></div></div></div>`}
function renderAnnex(){return `${header('秘密の別館','まだ内緒の、未来のサプライズ計画','🗝 The Secret Annex')}<div class="content"><div class="grid2"><div class="panel" style="display:flex;flex-direction:column;gap:8px"><h3>✦ 新しい秘密を仕掛ける</h3><input id="annexTitle" placeholder="例：クリスマスの小さな奇跡"><input id="annexDate" type="date"><select id="annexKind"><option>Coming Soon</option><option>サプライズ計画</option><option>暗号メッセージ</option><option>秘密の約束</option></select><textarea id="annexBody" placeholder="秘密の内容・暗号・ヒントを書く…"></textarea><label class="smalllabel"><input type="checkbox" id="annexReveal" style="width:auto"> 指定日まで内容を伏せておく</label><button class="btn" data-action="save-annex">秘密をしまう 🔐</button><div class="muted">※この試作品の「男性側のみ」は画面上の設定であり、本当のアクセス制限ではありません。安全な制限にはログインとサーバー側権限設定が必要です。</div></div><div class="panel scrollinner"><h3>🌒 秘密の棚</h3>${data.annex.length?data.annex.map(a=>`<div class="message"><div class="meta">${esc(a.date||'日付未定')} · ${esc(a.kind)}</div><b>${esc(a.title||'名前のない秘密')}</b>${a.reveal&&a.date>today()?`<div class="muted" style="margin-top:5px">🔒 ${esc(a.date)} に開く予定</div>`:`<div class="muted" style="margin-top:5px">${esc(a.body)}</div>`}<button class="btn ghost" data-action="delete-annex" data-id="${a.id}" style="margin-top:6px">削除</button></div>`).join(''):'<div class="muted">ここには、未来の笑顔の種をしまっておこう。</div>'}</div></div></div>`}
function renderSettings(){return `${header('家の設定','ふたりの家を、ふたりらしく整えよう','⚙ Settings')}<div class="content"><div class="grid2"><div class="panel scrollinner"><h3>♡ ふたりのプロフィール</h3><label class="smalllabel">あなたの表示名</label><input id="name1" value="${esc(data.name1)}"><label class="smalllabel" style="margin-top:8px">恋人の表示名</label><input id="name2" value="${esc(data.name2)}"><label class="smalllabel" style="margin-top:8px">付き合い始めた日</label><input id="started" type="date" value="${data.started}"><label class="smalllabel" style="margin-top:8px">次の記念日</label><input id="anniversary" type="date" value="${data.anniversary}"><label class="smalllabel" style="margin-top:8px">扉の合言葉（端末内デモ）</label><input id="password" value="${esc(data.password)}"><button class="btn" data-action="save-profile" style="margin-top:10px">プロフィールを保存</button></div><div class="panel scrollinner"><h3>✧ 季節と時間の魔法</h3><label class="smalllabel">季節の装飾</label><div class="season">${[['auto','自動'],['sakura','🌸 桜'],['spring','🌿 新緑'],['summer','🌊 夏'],['halloween','🎃 ハロウィン'],['xmas','🎄 クリスマス'],['snow','❄ 雪']].map(([v,l])=>`<button class="btn ${data.season===v?'':'ghost'}" data-season="${v}">${l}</button>`).join('')}</div><label class="smalllabel" style="margin-top:12px">時間帯</label><div class="season"><button class="btn ${data.timeMode==='auto'?'':'ghost'}" data-time="auto">自動</button><button class="btn ${data.timeMode==='morning'?'':'ghost'}" data-time="morning">☀ 朝</button><button class="btn ${data.timeMode==='night'?'':'ghost'}" data-time="night">☾ 夜</button></div><h3 style="margin-top:18px">📦 データについて</h3><div class="muted">今の試作品は、写真・手紙・予定などをこのブラウザ内に保存します。ブラウザのデータを消すと失われる場合があります。ふたりで共有するには、Supabase等の無料枠を使った認証・データベース・写真ストレージの接続が必要です。</div><button class="btn ghost" data-action="export-data" style="margin-top:10px">データをバックアップ</button><label class="btn ghost" style="display:block;text-align:center;margin-top:7px">バックアップを読み込む<input type="file" id="importData" accept="application/json" style="display:none"></label><button class="btn ghost" data-action="lock" style="margin-top:7px">扉に戻る</button></div></div></div>`}
function wireRoom(){
$$('[data-room]').forEach(b=>b.onclick=()=>switchRoom(b.dataset.room));$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));$$('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render()});$$('[data-food]').forEach(b=>b.onclick=()=>{let arr=b.dataset.food==='1'?data.food1:data.food2;let v=b.dataset.value;arr=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];if(b.dataset.food==='1')data.food1=arr;else data.food2=arr;save();render()});$$('[data-mood]').forEach(b=>b.onclick=()=>{if(b.dataset.mood==='1')data.mood1=b.dataset.value;else data.mood2=b.dataset.value;save();render()});$$('[data-season]').forEach(b=>b.onclick=()=>{data.season=b.dataset.season;save();render()});$$('[data-time]').forEach(b=>b.onclick=()=>{data.timeMode=b.dataset.time;save();render()});let f=$('#memoryPhoto');if(f)f.onchange=()=>$('#photoCount').textContent=`${f.files.length}枚選択中（1枚あたり約1MB以下推奨）`;let ci=$('#chatInput');if(ci){ci.oninput=()=>$('#typingHint').textContent=ci.value?'入力中…':'ふたりの会話がここに増えていくよ。';ci.onkeydown=e=>{if(e.key==='Enter')action('send-chat')}}let imp=$('#importData');if(imp)imp.onchange=async()=>{try{data={...defaults,...JSON.parse(await imp.files[0].text())};save();render();toast('バックアップを読み込みました')}catch{toast('ファイルを読み込めませんでした')}}}
async function action(a,id){if(a==='goto-calendar'){switchRoom('library');return}if(a==='month-prev'||a==='month-next'){let d=new Date(selectedDate+'T12:00:00');d.setMonth(d.getMonth()+(a==='month-prev'?-1:1));selectedDate=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;render();return}if(a==='save-memory'){let title=$('#memoryTitle').value.trim(),text=$('#memoryText').value.trim(),files=[...($('#memoryPhoto')?.files||[])];if(!title&&!text&&!files.length){toast('タイトル・本文・写真のどれかを入れてね');return}if(files.length>4){toast('一度に選べる写真は4枚までだよ');return}let photo='';if(files[0]){if(files[0].size>2*1024*1024){toast('写真が大きいみたい。2MB以下の写真を選んでね');return}photo=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(files[0])})}data.memories.push({id:Date.now(),date:selectedDate,title,text,photo});save();render();toast('思い出を星の図書館にしまったよ ✨');return}if(a==='delete-memory'){data.memories=data.memories.filter(m=>String(m.id)!==id);save();render();return}if(a==='save-letter'){let title=$('#letterTitle').value.trim()||'小さな手紙',body=$('#letterBody').value.trim();if(!body){toast('手紙の本文を書いてね');return}let to=$('#letterTo').value,letterDate=$('#letterDate').value||selectedDate;data.letters.push({id:Date.now(),title,body,to,date:selectedDate,futureDate:to==='future'?letterDate:'',read:false});save();render();if(to==='both'){letterPending=true;$('#creature').classList.remove('hide');toast('小さな動物が手紙を届けに来たよ！ 💌')}else toast('未来への手紙を大切にしまったよ 🌟');return}if(a==='check-letter'){let l=data.letters.find(x=>x.to==='both'&&!x.read);if(l){letterPending=true;$('#creature').classList.remove('hide')}else toast('今は届いている手紙はないみたい。またのお楽しみ！');return}if(a==='save-food1'||a==='save-food2'){save();toast('今日の気分を保存したよ 🍲');return}if(a==='save-requests'){data.requests=$('#requests').value;save();toast('ふたりへのメモを保存したよ ♡');return}if(a==='send-chat'){let inp=$('#chatInput'),v=inp.value.trim();if(!v)return;data.chat.push({who:'me',text:v,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});save();render();let log=$('#chatlog');log.scrollTop=log.scrollHeight;return}if(a==='save-annex'){let title=$('#annexTitle').value.trim(),body=$('#annexBody').value.trim();if(!title&&!body){toast('秘密のタイトルか内容を書いてね');return}data.annex.unshift({id:Date.now(),title,body,date:$('#annexDate').value,kind:$('#annexKind').value,reveal:$('#annexReveal').checked});save();render();toast('秘密の棚にしまったよ 🔐');return}if(a==='delete-annex'){data.annex=data.annex.filter(x=>String(x.id)!==id);save();render();return}if(a==='save-profile'){['name1','name2','started','anniversary','password'].forEach(k=>{let el=$('#'+k);if(el&&el.value.trim())data[k]=el.value.trim()});save();render();toast('家の設定を保存したよ');return}if(a==='export-data'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='our-little-home-backup.json';link.click();URL.revokeObjectURL(url);toast('バックアップを作成したよ');return}if(a==='lock'){data.unlocked=false;save();$('#entry').classList.remove('hide');$('#doorPassword').value='';return}}
$('#openDoor').onclick=()=>{if($('#doorPassword').value!==data.password){toast('合言葉が違うみたい。もう一度試してね');return}$('#doorArt').classList.add('open');setTimeout(()=>{$('#entry').classList.add('hide');$('#doorArt').classList.remove('open');data.unlocked=true;save();render()},700)};$('#settingsOpen').onclick=()=>switchRoom('settings');$('#seasonQuick').onclick=()=>switchRoom('settings');$('#openLetter').onclick=()=>{let l=data.letters.find(x=>x.to==='both'&&!x.read);$('#creature').classList.add('hide');if(l){l.read=true;save();switchRoom('library');selectedDate=l.date;render();toast('手紙を開いたよ。大切に読んでね 💌')}else toast('手紙はまだないみたい')};$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-room]');if(b)switchRoom(b.dataset.room)});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
